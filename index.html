		<!-- CALC SECTION-->
		<section id="box-form" class="calc-box form-section">
			<h2 class="title-section">Parametry lasagne</h2>

			<div id="params-card" class="card">
				<form id="lasagne-form">

					<div class="form-group custom-select" data-id="lasagne-type">
						<label>Typ lasagne</label>

						<!-- 1. Przycisk/obszar do klikania (otwiera menu) -->
						<div class="select-trigger">
							<span>Klasyczna (Bolońska)</span>
						</div>

						<!-- 2. Lista opcji do wyboru -->
						<div class="custom-options">
							<div class="option selected" data-value="standard">Klasyczna (Bolońska)</div>
							<div class="option" data-value="vege">Wegetariańska</div>
							<div class="option" data-value="spinach">Ze szpinakiem</div>
						</div>

						<!-- 3. BARDZO WAŻNE: Ukryty input z id="lasagne-type" -->
						<input type="hidden" id="lasagne-type" name="lasagne-type" value="standard">
					</div>

					<div class="form-group">
						<label for="tray-size">Rozmiar blachy do pieczenia</label>
						<select id="tray-size" name="tray-size">
							<option value="small">25x30 cm</option>
							<option value="midi">25x36 cm</option>
							<option value="large">25x40 cm</option>
							<option value="custom">Własna (wpisz wymiary)...</option>
						</select>
					</div>

					<div id="custom-size-inputs" class="form-group" style="display: none;">
						<div class="form-row">
							<div class="form-group"> <label for="custom-width">Szerokość (cm)</label>
								<input type="number" id="custom-width" min="10" max="60" value="25">
							</div>
							<div class="form-group">
								<label for="custom-length">Długość (cm)</label>
								<input type="number" id="custom-length" min="10" max="60" value="35">
							</div>
						</div>
					</div>

					<div class="form-group">
						<label for="tray-depth">Głębokość blachy</label>
						<select id="tray-depth">
							<option value="4">Płytka (4 cm)</option>
							<option value="6" selected>Standardowa (6 cm)</option>
							<option value="8">Głęboka (8 cm)</option>
						</select>
					</div>

					<div class="form-group">
						<label for="layers">Liczba warstw</label>
						<input type="number" id="layers" min="1" value="1">
					</div>

				</form>

				<button type="button" id="calculate-btn" class="btn-calc">Oblicz przepis</button>
			</div>
			<div class="calc-inner-box controls-section card">
				<form action="">
					<div class="form-row">
						<div class="form-group">
							<label for="total-time">Całkowity czas pieczenia (min)</label>
							<input type="number" id="total-time" value="" disabled>
						</div>
						<div class="form-group">
							<label for="elapsed-time">Ile minut już się piecze?</label>
							<input type="number" id="elapsed-time" min="0" value="0">
						</div>
					</div>
				</form>
			</div>

			<div class="calc-inner-box result-widget">
				<div id="result-display" class="result-area">
					<p>Czas pozostały: <span id="remaining-time">-- </span><span id="unit">min</span></p>
				</div>
			</div>

		</section>


	</main>

	<script type="module" src="/src/assets/js/app.js"></script>
